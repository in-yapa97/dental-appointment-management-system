name: Continuous Deployment (CD) & Health Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Production Deployment & Verification
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Build Backend & Frontend Production Assets
        run: |
          cd backend && chmod +x mvnw && ./mvnw clean package -DskipTests
          cd ../frontend && npm install && npm run build

      - name: Deployment Instructions & Secret Injection
        run: |
          echo "Deploying Spring Boot backend with DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, FRONTEND_URL..."
          echo "Deploying React Vite frontend with VITE_API_URL..."

      - name: Production Backend Health Verification
        run: |
          echo "Verifying backend health check endpoint (/api/v1/health)..."
