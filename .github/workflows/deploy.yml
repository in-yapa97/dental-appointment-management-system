name: Continuous Deployment (CD) & Health Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Production Deployment & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Build Backend & Frontend Production Assets
        run: |
          cd backend && chmod +x mvnw && ./mvnw clean package -DskipTests
          cd ../frontend && npm install && npm run build

      - name: Verify Live Railway Backend Health
        run: |
          echo "Verifying production backend health check endpoint..."
          curl --fail --retry 5 --retry-delay 5 -s https://dental-appointment-management-system-production.up.railway.app/api/v1/health

