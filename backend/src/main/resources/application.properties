# =============================================================================
# Dental Appointment and Patient Management System - Backend Configuration
# =============================================================================

# Server Port
server.port=${SERVER_PORT:8080}

# Application Metadata
info.app.name=Dental Appointment and Patient Management System
info.app.version=0.0.1-SNAPSHOT

# -----------------------------------------------------------------------------
# PostgreSQL Datasource Configuration
# Sourced strictly from environment variables (with non-secret development defaults)
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dental_db}}
spring.datasource.username=${DB_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (HikariCP)
# initialization-fail-timeout = -1 allows application startup and health check even before database schema exists
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

# -----------------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# -----------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Schema Handling: parameterized via JPA_DDL_AUTO (defaults to none for credential-less boot, set to update when DB is configured)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# JWT & Security Configuration
# -----------------------------------------------------------------------------
# Sourced strictly from environment variable JWT_SECRET (set in .env or deployment environment)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

