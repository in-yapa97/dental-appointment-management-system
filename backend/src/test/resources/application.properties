# =============================================================================
# Test Configuration - Dental Appointment and Patient Management System
# =============================================================================

# In-memory H2 database for isolated, fast, automated test execution
spring.datasource.url=jdbc:h2:mem:dental_test_db;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL and Dialect for Test Execution
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Application metadata
info.app.name=Dental Appointment and Patient Management System (Test)
info.app.version=0.0.1-SNAPSHOT

# JWT Test Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

